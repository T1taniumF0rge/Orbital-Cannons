pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases/"
        }

        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net/"
        }

        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {

    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )

    repositories {

        mavenCentral()

        maven {
            url = "https://maven.fabricmc.net/"
        }

        maven {
            url = "https://maven.neoforged.net/releases/"
        }

        maven {
            url = "https://maven.minecraftforge.net/"
        }

        maven {
            url = "https://repo.papermc.io/repository/maven-public/"
        }
    }
}

rootProject.name = "OrbitalStrike"

include(
        "common",
        "fabric",
        "quilt",
        "forge",
        "neoforge",
        "bukkit",
        "paper",
        "purpur",
        "folia"
)
